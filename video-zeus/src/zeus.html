<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const TL = window.__TL__;
const W = 1080, H = 1920, CX = 540;
const cv = document.getElementById('c');
const g = cv.getContext('2d');
window.SUBS = true;

// ---------- paleta ----------
const GOLD = '#FFC83D', GOLD2 = '#FF9F1C', BLUE = '#45C4FF', PURPLE = '#7B5CFF',
      GREEN = '#2EE59D', RED = '#FF4D6A', WHITE = '#FFFFFF', INK = '#05070F',
      CARD = 'rgba(18,24,48,0.86)', LINE = 'rgba(120,150,255,0.18)', MUTED = '#8B93B8';

// ---------- utilidades ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eOut5 = x => 1 - Math.pow(1 - x, 5);
const eIn = x => x * x * x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const eElastic = x => x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI / 3)) + 1;
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function hash(n) { const r = rng(Math.floor(n * 9301 + 49297)); r(); return r(); }
function noise1(x) { const i = Math.floor(x), f = x - i; const a = hash(i), b = hash(i + 1); const u = f * f * (3 - 2 * f); return a + (b - a) * u; }
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function font(sz, w = 900, fam = 'ZD') { g.font = `${w} ${sz}px ${fam}`; }
function text(s, x, y, sz, col, w = 900, align = 'center', fam = 'ZD') { font(sz, w, fam); g.textAlign = align; g.textBaseline = 'middle'; g.fillStyle = col; g.fillText(s, x, y); }
function glowText(s, x, y, sz, col, blur = 30, w = 900, align = 'center') {
  g.save(); g.shadowColor = col; g.shadowBlur = blur; text(s, x, y, sz, col, w, align); g.restore();
  text(s, x, y, sz, col, w, align);
}
function withT(x, y, s, a, rot, fn) { if (a <= 0.001 || s <= 0.001) return; g.save(); g.globalAlpha *= clamp(a); g.translate(x, y); if (rot) g.rotate(rot); g.scale(s, s); fn(); g.restore(); }
function goldGrad(x0, y0, x1, y1) { const gr = g.createLinearGradient(x0, y0, x1, y1); gr.addColorStop(0, '#FFE58A'); gr.addColorStop(.5, GOLD); gr.addColorStop(1, GOLD2); return gr; }

// ---------- logo ----------
function boltPath(s) {
  g.beginPath();
  const p = [[0.18, -1], [-0.55, 0.12], [-0.05, 0.12], [-0.22, 1], [0.55, -0.2], [0.05, -0.2], [0.3, -1]];
  p.forEach(([x, y], i) => i ? g.lineTo(x * s, y * s) : g.moveTo(x * s, y * s)); g.closePath();
}
function drawBolt(s, fill = null, glow = 40) {
  boltPath(s);
  g.save(); g.shadowColor = GOLD; g.shadowBlur = glow; g.fillStyle = fill || goldGrad(-s, -s, s, s); g.fill(); g.restore();
  boltPath(s); g.fillStyle = fill || goldGrad(-s, -s, s, s); g.fill();
}
function hexPath(r) { g.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i - Math.PI / 2; const x = Math.cos(a) * r, y = Math.sin(a) * r; i ? g.lineTo(x, y) : g.moveTo(x, y); } g.closePath(); }
function drawLogoMark(r, t, ring = 1) {
  // hexagono con borde dorado, fondo oscuro, rayo
  g.save();
  hexPath(r); const bg = g.createRadialGradient(0, -r * .3, 0, 0, 0, r * 1.2); bg.addColorStop(0, '#1C2552'); bg.addColorStop(1, '#070A1C'); g.fillStyle = bg; g.fill();
  g.shadowColor = GOLD; g.shadowBlur = 30 * ring; hexPath(r); g.lineWidth = r * 0.07; g.strokeStyle = goldGrad(-r, -r, r, r); g.stroke();
  g.restore();
  drawBolt(r * 0.62, null, 30 + 15 * Math.sin(t * 6));
}

// ---------- rayo fractal ----------
function lightningPts(x0, y0, x1, y1, seed, disp) {
  const r = rng(seed); let pts = [[x0, y0], [x1, y1]];
  for (let it = 0; it < 7; it++) {
    const np = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
      const mx = (ax + bx) / 2 + (r() - .5) * disp, my = (ay + by) / 2 + (r() - .5) * disp * .3;
      np.push([mx, my], pts[i + 1]);
    }
    pts = np; disp *= 0.55;
  }
  return pts;
}
function drawLightning(x0, y0, x1, y1, seed, alpha, width = 6, col = '#CFE9FF') {
  if (alpha <= 0) return;
  const pts = lightningPts(x0, y0, x1, y1, seed, Math.hypot(x1 - x0, y1 - y0) * 0.45);
  g.save(); g.globalAlpha *= alpha; g.lineJoin = 'round'; g.lineCap = 'round';
  const stroke = (w, c, b) => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.lineWidth = w; g.strokeStyle = c; g.shadowColor = BLUE; g.shadowBlur = b; g.stroke(); };
  stroke(width * 3, 'rgba(69,196,255,0.35)', 40); stroke(width, col, 20); stroke(width * 0.4, '#FFFFFF', 0);
  // ramas
  const r = rng(seed + 7);
  for (let k = 0; k < 4; k++) {
    const i = Math.floor(r() * pts.length * 0.8); const [sx, sy] = pts[i];
    const bp = lightningPts(sx, sy, sx + (r() - .5) * 400, sy + 150 + r() * 250, seed + k * 13, 160);
    g.beginPath(); bp.forEach(([x, y], j) => j ? g.lineTo(x, y) : g.moveTo(x, y)); g.lineWidth = width * .5; g.strokeStyle = col; g.shadowBlur = 15; g.stroke();
  }
  g.restore();
}

// ---------- fondo ----------
const STARS = (() => { const r = rng(42); return Array.from({ length: 140 }, () => ({ x: r() * W, y: r() * H, z: .3 + r() * .7, p: r() * 6.28 })); })();
function sceneAt(t) { let s = TL.scenes[0]; for (const sc of TL.scenes) if (t >= sc.start) s = sc; return s; }
const TINT = { hook: '#1A1F4A', problem: '#3A1020', reveal: '#1B2366', store: '#122A5C', sales: '#3A2A0C', views: '#0E2E4A', research: '#25165A', productivity: '#123A30', cta: '#2A1E5E' };
function background(t) {
  const sc = sceneAt(t);
  g.fillStyle = INK; g.fillRect(-60, -60, W + 120, H + 120);
  const pulse = 0.85 + 0.15 * Math.sin(t * Math.PI * 2 * 1); // 120bpm/2
  const rg = g.createRadialGradient(CX, 820, 0, CX, 820, 1250);
  rg.addColorStop(0, TINT[sc.id] || '#1A1F4A'); rg.addColorStop(1, 'rgba(5,7,15,0)');
  g.globalAlpha = pulse; g.fillStyle = rg; g.fillRect(-60, -60, W + 120, H + 120); g.globalAlpha = 1;
  // rejilla en perspectiva (suelo)
  g.save(); g.strokeStyle = 'rgba(69,196,255,0.10)'; g.lineWidth = 2;
  const hy = 1250, off = (t * 60) % 80;
  for (let i = -12; i <= 12; i++) { g.beginPath(); g.moveTo(CX + i * 30, hy); g.lineTo(CX + i * 260, H + 40); g.stroke(); }
  for (let k = 0; k < 14; k++) { const z = (k * 80 + off) / 1120; const y = hy + Math.pow(z, 2.2) * (H - hy + 60); g.globalAlpha = z; g.beginPath(); g.moveTo(-60, y); g.lineTo(W + 60, y); g.stroke(); }
  g.restore();
  // particulas
  for (const s of STARS) {
    const y = (s.y - t * 40 * s.z) % H; const yy = y < 0 ? y + H : y;
    g.globalAlpha = (0.25 + 0.5 * Math.abs(Math.sin(t * 1.5 + s.p))) * s.z;
    g.fillStyle = s.z > .8 ? GOLD : '#9FB4FF'; g.beginPath(); g.arc(s.x, yy, 1.5 + s.z * 2, 0, 6.29); g.fill();
  }
  g.globalAlpha = 1;
}
function vignette() {
  const v = g.createRadialGradient(CX, H / 2, 500, CX, H / 2, 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.75)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

// ---------- componentes UI ----------
function card(x, y, w, h, r = 36, border = 'rgba(255,200,61,0.35)') {
  g.save(); g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 40; g.shadowOffsetY = 18; rr(x, y, w, h, r); g.fillStyle = CARD; g.fill(); g.restore();
  rr(x, y, w, h, r); const gr = g.createLinearGradient(x, y, x, y + h); gr.addColorStop(0, 'rgba(255,255,255,0.07)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fill();
  rr(x, y, w, h, r); g.lineWidth = 2.5; g.strokeStyle = border; g.stroke();
}
function pill(x, y, label, col, bg, sz = 30, align = 'center') {
  font(sz, 700, 'ZI'); const w = g.measureText(label).width + sz * 1.3, h = sz * 1.75;
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  rr(x0, y - h / 2, w, h, h / 2); g.fillStyle = bg; g.fill();
  text(label, x0 + w / 2, y + 1, sz, col, 700, 'center', 'ZI'); return w;
}
// titulo de seccion: "01" + nombre
function sectionTitle(lt, num, name, sub, col = GOLD) {
  const a = eOut(P(lt, 0.1, 0.6));
  withT(CX, 230, 1, a, 0, () => {
    g.translate(0, (1 - a) * -40);
    const w = pill(0, -70, num + ' / 05', INK, col, 28);
  });
  const chars = name.length;
  font(118, 900); const tw = g.measureText(name).width; const sc = Math.min(1, 940 / tw);
  withT(CX, 300, sc, 1, 0, () => {
    let x = -tw / 2;
    for (let i = 0; i < chars; i++) {
      const ch = name[i]; const cw = g.measureText(ch).width; const p = eBack(P(lt, 0.2 + i * 0.035, 0.55 + i * 0.035));
      g.save(); g.globalAlpha = clamp(p); g.translate(x + cw / 2, (1 - p) * 60); g.scale(1, clamp(p, 0, 1.2));
      g.fillStyle = WHITE; g.textAlign = 'center'; g.textBaseline = 'middle'; font(118, 900); g.fillText(ch, 0, 0); g.restore(); x += cw;
    }
  });
  const sa = eOut(P(lt, 0.7, 1.1));
  withT(CX, 385, 1, sa, 0, () => { g.translate(0, (1 - sa) * 20); text(sub, 0, 0, 34, col, 800); });
}

// ---------- iconos ----------
function iconStore(s, col = GOLD) {
  g.save(); g.scale(s / 100, s / 100); g.lineWidth = 7; g.strokeStyle = col; g.lineJoin = 'round';
  // toldo
  for (let i = 0; i < 5; i++) { g.beginPath(); g.moveTo(-80 + i * 32, -40); g.lineTo(-80 + i * 32 + 32, -40); g.arc(-80 + i * 32 + 16, -40, 16, 0, Math.PI); g.closePath(); g.fillStyle = i % 2 ? col : 'rgba(255,255,255,0.9)'; g.fill(); }
  g.beginPath(); g.moveTo(-80, -40); g.lineTo(-62, -80); g.lineTo(62, -80); g.lineTo(80, -40); g.closePath(); g.fillStyle = col; g.fill();
  rr(-70, -22, 140, 102, 6); g.stroke(); rr(-22, 20, 44, 60, 4); g.stroke(); rr(-58, 0, 26, 26, 3); g.stroke(); rr(32, 0, 26, 26, 3); g.stroke();
  g.restore();
}
function iconChart(s, col = GOLD) { g.save(); g.scale(s / 100, s / 100); g.fillStyle = col; [[-70, 30, 30], [-25, -10, 70], [20, -50, 110]].forEach(([x, y, h]) => { rr(x, y + 0, 40, h - (y + 0) + y + 0 + 0 + (60 - h) * 0 + 0, 6); }); rr(-70, 20, 34, 60, 6); g.fill(); rr(-17, -15, 34, 95, 6); g.fill(); rr(36, -60, 34, 140, 6); g.fill(); g.restore(); }
function iconEye(s, col = GOLD, look = 0, blink = 1) {
  g.save(); g.scale(s / 100, s / 100); g.lineWidth = 8; g.strokeStyle = col;
  g.beginPath(); g.moveTo(-90, 0); g.quadraticCurveTo(0, -80 * blink, 90, 0); g.quadraticCurveTo(0, 80 * blink, -90, 0); g.closePath(); g.stroke();
  g.save(); g.clip(); g.beginPath(); g.arc(look * 25, 0, 32, 0, 6.29); g.fillStyle = col; g.fill(); g.beginPath(); g.arc(look * 25, 0, 14, 0, 6.29); g.fillStyle = INK; g.fill(); g.beginPath(); g.arc(look * 25 + 10, -10, 6, 0, 6.29); g.fillStyle = WHITE; g.fill(); g.restore();
  g.restore();
}
function iconSearch(s, col = GOLD) { g.save(); g.scale(s / 100, s / 100); g.lineWidth = 14; g.strokeStyle = col; g.lineCap = 'round'; g.beginPath(); g.arc(-12, -12, 50, 0, 6.29); g.stroke(); g.beginPath(); g.moveTo(25, 25); g.lineTo(72, 72); g.stroke(); g.restore(); }
function iconClock(s, col, a1, a2) { g.save(); g.scale(s / 100, s / 100); g.lineWidth = 10; g.strokeStyle = col; g.beginPath(); g.arc(0, 0, 80, 0, 6.29); g.stroke(); for (let i = 0; i < 12; i++) { const a = i / 12 * 6.28; g.beginPath(); g.moveTo(Math.cos(a) * 64, Math.sin(a) * 64); g.lineTo(Math.cos(a) * 72, Math.sin(a) * 72); g.lineWidth = 5; g.stroke(); } g.lineCap = 'round'; g.lineWidth = 10; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.sin(a1) * 40, -Math.cos(a1) * 40); g.stroke(); g.lineWidth = 6; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.sin(a2) * 60, -Math.cos(a2) * 60); g.stroke(); g.beginPath(); g.arc(0, 0, 8, 0, 6.29); g.fillStyle = col; g.fill(); g.restore(); }
function checkMark(x, y, s, p, col = GREEN) { if (p <= 0) return; g.save(); g.translate(x, y); g.lineWidth = s * .18; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = col; g.beginPath(); const pts = [[-.4, 0], [-.1, .3], [.45, -.35]]; const L1 = .42, L2 = .85, tot = L1 + L2; const d = p * tot; g.moveTo(pts[0][0] * s, pts[0][1] * s); if (d < L1) { const k = d / L1; g.lineTo(lerp(pts[0][0], pts[1][0], k) * s, lerp(pts[0][1], pts[1][1], k) * s); } else { g.lineTo(pts[1][0] * s, pts[1][1] * s); const k = (d - L1) / L2; g.lineTo(lerp(pts[1][0], pts[2][0], k) * s, lerp(pts[1][1], pts[2][1], k) * s); } g.stroke(); g.restore(); }

// ---------- explosion de particulas ----------
function burst(t, t0, x, y, n, seed, cols = [GOLD, BLUE, WHITE], spd = 900, life = 1.2) {
  const lt = t - t0; if (lt < 0 || lt > life) return; const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const a = r() * 6.283, v = spd * (0.3 + r() * .7), sz = 3 + r() * 7, c = cols[Math.floor(r() * cols.length)];
    const d = v * (1 - Math.exp(-lt * 3)) / 3; const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d + 120 * lt * lt;
    g.globalAlpha = clamp(1 - lt / life); g.fillStyle = c; g.beginPath(); g.arc(px, py, sz * (1 - lt / life * .5), 0, 6.29); g.fill();
  }
  g.globalAlpha = 1;
}
function shockwave(t, t0, x, y, maxR = 900, col = GOLD, dur = 0.9, w = 14) {
  const lt = t - t0; if (lt < 0 || lt > dur) return; const p = eOut(lt / dur);
  g.save(); g.globalAlpha = 1 - lt / dur; g.lineWidth = w * (1 - p) + 1; g.strokeStyle = col; g.shadowColor = col; g.shadowBlur = 30; g.beginPath(); g.arc(x, y, maxR * p, 0, 6.29); g.stroke(); g.restore();
}

// =====================================================================
// ESCENAS
// =====================================================================
function sHook(t, lt) {
  // tienda flotando con signos de pregunta
  const a = eBack(P(lt, 0.0, 0.6));
  const fl = Math.sin(lt * 2.5) * 12;
  // halo
  g.save(); const hg = g.createRadialGradient(CX, 760, 0, CX, 760, 420); hg.addColorStop(0, 'rgba(255,200,61,0.25)'); hg.addColorStop(1, 'rgba(255,200,61,0)'); g.fillStyle = hg; g.globalAlpha = a; g.fillRect(0, 300, W, 900); g.restore();
  withT(CX, 760 + fl, 2.6 * a, 1, Math.sin(lt * 1.7) * 0.04, () => iconStore(100, GOLD));
  // signos ? orbitando
  for (let i = 0; i < 6; i++) {
    const ang = lt * 0.9 + i / 6 * 6.283, rad = 360 + 40 * Math.sin(lt * 2 + i);
    const pa = eBack(P(lt, 0.3 + i * 0.12, 0.8 + i * 0.12));
    const flick = 0.55 + 0.45 * noise1(lt * 8 + i * 10);
    withT(CX + Math.cos(ang) * rad, 760 + Math.sin(ang) * rad * 0.75, pa * (0.8 + (i % 3) * .25), flick, Math.sin(lt * 3 + i) * .3, () => glowText('?', 0, 0, 110, i % 2 ? BLUE : WHITE, 25));
  }
  // titular cinetico
  const L1 = [['¿QUÉ', WHITE], ['ESTÁ', WHITE], ['PASANDO', WHITE]], L2 = [['EN', WHITE], ['TU', WHITE], ['TIENDA?', GOLD]];
  const line = (arr, y, t0, sz) => {
    font(sz, 900); const sp = 22; const ws = arr.map(([s]) => g.measureText(s).width); const tot = ws.reduce((a, b) => a + b, 0) + sp * (arr.length - 1);
    let x = CX - tot / 2;
    arr.forEach(([s, c], i) => { const p = eBack(P(lt, t0 + i * 0.4, t0 + i * 0.4 + 0.35)); withT(x + ws[i] / 2, y, lerp(1.6, 1, clamp(p)) , clamp(p * 1.5), 0, () => c === GOLD ? glowText(s, 0, 0, sz, c, 30) : text(s, 0, 0, sz, c)); x += ws[i] + sp; });
  };
  line(L1, 1210, 0.45, 90); line(L2, 1325, 1.65, 112);
  // glitch al final
  const gp = P(lt, 5.25, 6);
  if (gp > 0) { const r = rng(Math.floor(t * 30)); for (let i = 0; i < 9; i++) { const y = r() * H, h = 10 + r() * 60; g.drawImage(cv, 0, y, W, h, (r() - .5) * 120 * gp, y, W, h); } g.fillStyle = `rgba(255,77,106,${0.12 * gp})`; g.fillRect(0, 0, W, H); }
}

function sheet(seed, w, h, lt) {
  const r = rng(seed);
  card(-w / 2, -h / 2, w, h, 18, 'rgba(255,255,255,0.25)');
  rr(-w / 2, -h / 2, w, 46, [18, 18, 0, 0]); g.fillStyle = 'rgba(255,255,255,0.12)'; g.fill();
  [RED, GOLD, GREEN].forEach((c, i) => { g.beginPath(); g.arc(-w / 2 + 28 + i * 26, -h / 2 + 23, 8, 0, 6.29); g.fillStyle = c; g.fill(); });
  text(['ventas_final_v3.xlsx', 'inventario(2).xlsx', 'pedidos_mayo.csv', 'stats_REAL.xlsx', 'reporte_copia.xlsx'][seed % 5], -w / 2 + 110, -h / 2 + 24, 20, MUTED, 600, 'left', 'ZI');
  const rows = 6, cols = 4, cw = (w - 30) / cols, rh = (h - 70) / rows;
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
    const x = -w / 2 + 15 + j * cw, y = -h / 2 + 58 + i * rh;
    g.strokeStyle = 'rgba(255,255,255,0.10)'; g.lineWidth = 1.5; g.strokeRect(x, y, cw, rh);
    const bad = r() < 0.18; const val = (r() * 9999).toFixed(0);
    text(bad ? '#¡REF!' : val, x + cw / 2, y + rh / 2, 19, bad ? RED : '#C9D1F5', 600, 'center', 'ZI');
  }
}
function sProblem(t, lt) {
  const shakeAll = P(lt, 6.4, 8) * 14;
  const suck = eIn(P(lt, 6.9, 8));
  // reloj central acelerando
  const spin = lt * lt * 1.6;
  withT(CX, 880, 2.4 * (1 - suck), 1 - suck, 0, () => { g.save(); g.shadowColor = RED; g.shadowBlur = 30; iconClock(100, lt > 4.5 ? RED : WHITE, spin / 12, spin); g.restore(); });
  // hojas que aparecen
  const r = rng(77);
  for (let i = 0; i < 10; i++) {
    const t0 = 0.4 + i * 0.55; const p = eBack(P(lt, t0, t0 + 0.35));
    let x = 170 + r() * 740, y = 520 + r() * 820, rot = (r() - .5) * 0.5; const w = 360 + r() * 120, h = 260 + r() * 80;
    if (p <= 0) continue;
    x = lerp(x, CX, suck); y = lerp(y, 880, suck);

    const p = eBack(P(lt, 1.6 + i * 0.25, 2.1 + i * 0.25)) * (1 - eIn(P(lt, 5.0, 5.4)));
    const fl = Math.sin(lt * 2 + i) * 10;
    withT(CX + dx * 1.05, cy + dy + fl, clamp(p, 0, 1.2), clamp(p), 0, () => pill(0, 0, '#' + s.replace(/ /g, ''), WHITE, 'rgba(123,92,255,0.75)', 26));
  });
  // tarjeta tendencia detectada
  const fp = eBack(P(lt, 5.4, 5.9));
  withT(CX, 1300, clamp(fp, 0, 1.15), clamp(fp), 0, () => {
    g.save(); g.shadowColor = GOLD; g.shadowBlur = 40; rr(-430, -130, 860, 290, 36); g.fillStyle = '#17123A'; g.fill(); g.restore();
    rr(-430, -130, 860, 290, 36); g.strokeStyle = GOLD; g.lineWidth = 4; g.stroke();
    text('TENDENCIA DETECTADA', -390, -80, 30, GOLD, 900, 'left');
    text('#regalospersonalizados', -390, -28, 40, WHITE, 800, 'left');
    glowText('+245%', 290, -62, 80, GREEN, 20); text('búsquedas', 290, -8, 24, MUTED, 600, 'center', 'ZI');
    const m = (lab, v, col, y, d) => { text(lab, -390, y, 26, MUTED, 600, 'left', 'ZI'); rr(-150, y - 9, 300, 18, 9); g.fillStyle = 'rgba(255,255,255,0.1)'; g.fill(); rr(-150, y - 9, 300 * v * eOut(P(lt, d, d + 0.8)), 18, 9); g.fillStyle = col; g.fill(); text(v > .5 ? 'ALTA' : 'BAJA', 260, y, 26, col, 900, 'center'); };
    m('Competencia', 0.22, GREEN, 50, 7.2); m('Oportunidad', 0.9, GOLD, 100, 7.6);
  });
}

// ----- PRODUCTIVIDAD -----
function sProd(t, lt) {
  sectionTitle(lt, '05', 'PRODUCTIVIDAD', 'DE HORAS A MINUTOS', GREEN);
  // 3 HORAS -> 5 MIN
  const ap = eBack(P(lt, 0.5, 0.95));
  const strike = eOut(P(lt, 2.5, 2.8));
  const drop = eIn(P(lt, 2.85, 3.3));
  withT(CX, 620 + drop * 120, clamp(ap, 0, 1.2) * (1 - drop * .4), clamp(ap) * (1 - drop), drop * 0.2, () => {
    withT(-150, 0, 1, 1, 0, () => iconClock(70, RED, lt * 2, lt * 24));
    text('3 HORAS', 90, 0, 120, RED, 900);
    if (strike > 0) { g.lineWidth = 16; g.strokeStyle = WHITE; g.lineCap = 'round'; g.beginPath(); g.moveTo(-240, 10); g.lineTo(-240 + 590 * strike, -10); g.stroke(); }
  });
  const np = eBack(P(lt, 3.1, 3.5));
  withT(CX, 640, lerp(2.5, 1, clamp(np)), clamp(np * 2), 0, () => {
    g.save(); g.shadowColor = GOLD; g.shadowBlur = 50; font(200, 900); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = goldGrad(-300, -100, 300, 100); g.fillText('5 MIN', 0, 0); g.restore();
  });
  burst(t, 69.1, CX, 640, 60, 33, [GOLD, GREEN, WHITE], 1100, 1.2);
  // barras comparativas
  const bp = P(lt, 1.0, 1.3);
  g.save(); g.globalAlpha = bp;
  text('Antes', 110, 830, 30, MUTED, 700, 'left', 'ZI'); rr(110, 860, 860 * eOut(P(lt, 1.1, 2.2)), 34, 17); g.fillStyle = RED; g.fill();
  text('Con Zeus', 110, 940, 30, MUTED, 700, 'left', 'ZI'); rr(110, 970, Math.max(34, 860 * 0.05 * eOut(P(lt, 3.3, 3.8))), 34, 17); g.fillStyle = GREEN; g.fill();
  if (lt > 3.4) text('−97% de tiempo', 110 + 70, 987, 30, GREEN, 900, 'left');
  g.restore();
  // checklist
  const items = ['Revisar inventario', 'Analizar ventas', 'Ver tendencias', 'Reporte listo'];
  items.forEach((s, i) => {
    const t0 = 4.6 + i * 0.6; const p = eOut5(P(lt, t0 - 0.3, t0)); const y = 1090 + i * 92;
    withT(CX + (1 - p) * 400, y, 1, p, 0, () => {
      rr(-430, -38, 860, 76, 24); g.fillStyle = 'rgba(46,229,157,0.08)'; g.fill(); g.strokeStyle = 'rgba(46,229,157,0.35)'; g.lineWidth = 2; g.stroke();
      g.beginPath(); g.arc(-380, 0, 24, 0, 6.29); g.fillStyle = lt > t0 + 0.1 ? GREEN : 'rgba(255,255,255,0.1)'; g.fill();
      checkMark(-380, 0, 30, eOut(P(lt, t0 + 0.1, t0 + 0.35)), INK);
      text(s, -330, 2, 32, WHITE, 700, 'left', 'ZI');
      text('✓ hecho', 400, 2, 26, GREEN, 700, 'right', 'ZI');
    });
  });
  // build hacia el CTA
  const bu = P(lt, 7.5, 10);
  const mp = eBack(P(lt, 7.6, 8.0));
  withT(CX, 1480 - 0, clamp(mp, 0, 1.2) * (1 + bu * 0.15), clamp(mp) * (1 - P(lt, 9.6, 10)), 0, () => glowText('MÁS TIEMPO PARA CRECER', 0, 0, 62, GOLD, 30));
  if (bu > 0) { g.fillStyle = `rgba(255,255,255,${eIn(P(lt, 9.3, 10)) * 0.9})`; g.fillRect(0, 0, W, H); }
}

// ----- CTA -----
function sCTA(t, lt) {
  const cy = 700;
  // rayos de entrada
  [[0, 200, -80], [0.1, 880, 80], [0.22, 540, 0]].forEach(([d, x0, dx], i) => { const a = 1 - P(lt, d, d + 0.5); if (lt >= d) drawLightning(x0, -50, CX + dx, cy, 2000 + i * 17 + Math.floor(t * 15) * 5, a * a, 8); });
  shockwave(t, 76.0, CX, cy, 1100, GOLD, 1.0, 26); burst(t, 76.0, CX, cy, 80, 77, [GOLD, BLUE, WHITE], 1200, 1.5);
  // rayos de luz
  withT(CX, cy, 1, clamp(P(lt, 0.2, 1)) * 0.8, lt * 0.25, () => {
    for (let i = 0; i < 12; i++) { g.rotate(Math.PI / 6); const gr = g.createLinearGradient(0, 0, 0, -900); gr.addColorStop(0, 'rgba(255,200,61,0.2)'); gr.addColorStop(1, 'rgba(255,200,61,0)'); g.fillStyle = gr; g.beginPath(); g.moveTo(0, 0); g.lineTo(-70, -900); g.lineTo(70, -900); g.closePath(); g.fill(); }
  });
  // iconos orbitando
  const icons = [[iconStore, 'TIENDA', GOLD], [iconChart, 'VENTAS', GOLD], [iconEye, 'VISTAS', BLUE], [iconSearch, 'INVESTIGACIÓN', PURPLE]];
  const op = eBack(P(lt, 0.4, 1.2));
  const merge = eIO(P(lt, 6.2, 7.0));
  icons.forEach(([fn, lab, col], i) => {
    const a = lt * 0.6 + i / 4 * 6.283 - Math.PI / 2; const rad = 330 * clamp(op, 0, 1.1) * (1 - merge);
    const x = CX + Math.cos(a) * rad, y = cy + Math.sin(a) * rad * 0.85;
    g.save(); g.globalAlpha = clamp(op) * (1 - merge); g.strokeStyle = col + '66'; g.lineWidth = 3; g.setLineDash([10, 12]); g.lineDashOffset = -lt * 60; g.beginPath(); g.moveTo(CX, cy); g.lineTo(x, y); g.stroke(); g.restore();
    withT(x, y, clamp(op, 0, 1.2) * (1 - merge * .7), clamp(op) * (1 - merge), 0, () => {
      g.save(); g.shadowColor = col; g.shadowBlur = 25; g.beginPath(); g.arc(0, 0, 92, 0, 6.29); g.fillStyle = '#121838'; g.fill(); g.lineWidth = 4; g.strokeStyle = col; g.stroke(); g.restore();
      withT(0, -8, 0.5, 1, 0, () => fn(100, col)); text(lab, 0, 122, 26, col, 900);
    });
  });
  if (merge > 0.95) shockwave(t, 83.0, CX, cy, 700, GOLD, 0.8, 18);
  const lp = eBack(P(lt, 0.05, 0.6)); const pulse = 1 + 0.04 * Math.sin(lt * Math.PI * 4) + (lt > 7 ? 0.15 * Math.exp(-(lt - 7) * 4) : 0);
  withT(CX, cy, 0.75 * clamp(lp, 0, 1.2) * pulse * lerp(1, 1.25, merge), clamp(lp * 3), 0, () => drawLogoMark(220, t, 1.4));
  // titulares
  const h1 = eOut(P(lt, 2.8, 3.3)) * (1 - eIn(P(lt, 6.4, 6.9)));
  withT(CX, 1150, 1, h1, 0, () => { g.translate(0, (1 - h1) * 40); text('¿QUIERES VER', 0, -50, 78, WHITE, 900); glowText('CAMBIOS REALES?', 0, 40, 90, GOLD, 25, 900); });
  const h2 = eBack(P(lt, 7.0, 7.4));
  withT(CX, 1130, lerp(2.4, 1, clamp(h2)), clamp(h2 * 2), 0, () => {
    g.save(); g.shadowColor = GOLD; g.shadowBlur = 60; font(170, 900); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = goldGrad(-400, -90, 400, 90); g.fillText('ABRE ZEUS', 0, 0); g.restore();
  });
  // boton + cursor
  const bp = eBack(P(lt, 7.8, 8.3)); const press = lt > 9.5 && lt < 9.7 ? 0.92 : 1; const bpul = 1 + 0.03 * Math.sin(lt * 8);
  withT(CX, 1300, clamp(bp, 0, 1.2) * press * bpul, clamp(bp), 0, () => {
    g.save(); g.shadowColor = GOLD; g.shadowBlur = 40 + 20 * Math.sin(lt * 8); rr(-300, -62, 600, 124, 62); g.fillStyle = goldGrad(-300, -60, 300, 60); g.fill(); g.restore();
    withT(-200, 0, 0.32, 1, 0, () => drawBolt(100, INK, 0)); text('ABRIR ZEUS', 30, 3, 54, INK, 900);
  });
  // ripple del click
  if (lt > 9.5) { const rp = P(lt, 9.5, 10.3); g.save(); g.globalAlpha = 1 - rp; g.strokeStyle = WHITE; g.lineWidth = 6; rr(CX - 300 - rp * 80, 1300 - 62 - rp * 80, 600 + rp * 160, 124 + rp * 160, 62 + rp * 80); g.stroke(); g.restore(); }
  burst(t, 85.6, CX, 1300, 60, 99, [GOLD, WHITE, GREEN], 900, 1.2);
  const cp = eIO(P(lt, 8.5, 9.4)); const cxp = lerp(1000, CX + 120, cp), cyp = lerp(1700, 1320, cp);
  if (lt > 8.4 && lt < 11.5) withT(cxp, cyp, press < 1 ? 0.88 : 1, 1 - P(lt, 11, 11.5), 0, () => {
    g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 70); g.lineTo(18, 54); g.lineTo(32, 84); g.lineTo(44, 78); g.lineTo(30, 49); g.lineTo(52, 49); g.closePath(); g.fillStyle = WHITE; g.fill(); g.lineWidth = 4; g.strokeStyle = INK; g.stroke();
  });
  // tagline final
  const fp = eOut(P(lt, 10.6, 11.2));
  withT(CX, 1440, 1, fp, 0, () => { g.translate(0, (1 - fp) * 30); text('TU NEGOCIO, CON EL', 0, 0, 46, WHITE, 800); glowText('PODER DE UN DIOS', 0, 62, 60, GOLD, 25, 900); });
  // fade final
  const fo = P(lt, 13.3, 14); if (fo > 0) { g.fillStyle = `rgba(0,0,0,${fo})`; g.fillRect(0, 0, W, H); }
}

// ---------- transiciones ----------
function transition(t) {
  for (const b of [22, 34, 46, 56, 66]) {
    const p = P(t, b - 0.28, b + 0.28); if (p <= 0 || p >= 1) continue;
    // barrido diagonal dorado con forma de rayo
    const x = lerp(-900, W + 900, eIO(p));
    g.save(); g.translate(x, H / 2); g.rotate(-0.35);
    const gr = g.createLinearGradient(-300, 0, 300, 0); gr.addColorStop(0, 'rgba(255,200,61,0)'); gr.addColorStop(0.45, GOLD); gr.addColorStop(0.55, '#FFF3C4'); gr.addColorStop(1, 'rgba(255,200,61,0)');
    g.fillStyle = INK; g.fillRect(-260, -1600, 520, 3200);
    g.fillStyle = gr; g.fillRect(-330, -1600, 80, 3200); g.fillRect(250, -1600, 80, 3200);
    g.restore();
  }
}

// ---------- subtitulos ----------
function subtitles(t) {
  if (!window.SUBS) return;
  let c = null; for (const k of TL.captions) if (t >= k.start && t < k.end + 0.05) c = k;
  if (!c) return;
  const lt = t - c.start; const p = eBack(P(lt, 0, 0.18));
  const words = c.words; const sz = 66; font(sz, 900); const sp = 18;
  const ws = words.map(w => g.measureText(w.w.toUpperCase()).width);
  // dividir en 2 lineas si es muy largo
  let lines = [[...words.keys()]]; const tot = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  if (tot > 900) { let acc = 0, cut = 0; for (let i = 0; i < words.length; i++) { acc += ws[i] + sp; if (acc > tot / 2) { cut = i; break; } } cut = Math.max(1, cut); lines = [[...Array(cut).keys()], [...Array(words.length - cut).keys()].map(i => i + cut)]; }
  const baseY = 1590 - (lines.length - 1) * 40;
  const dur = c.end - c.start;
  withT(CX, baseY, lerp(0.7, 1, clamp(p, 0, 1.1)), clamp(p * 2), 0, () => {
    lines.forEach((ln, li) => {
      const lw = ln.reduce((a, i) => a + ws[i], 0) + sp * (ln.length - 1); let x = -lw / 2; const y = li * 82;
      ln.forEach(i => {
        const w = words[i]; const s = w.w.toUpperCase();
        // palabra activa (karaoke)
        const active = lt >= (i / words.length) * dur;
        g.save(); font(sz, 900); g.textAlign = 'left'; g.textBaseline = 'middle'; g.lineJoin = 'round';
        g.lineWidth = 14; g.strokeStyle = 'rgba(0,0,0,0.95)'; g.strokeText(s, x, y);
        g.shadowColor = 'rgba(0,0,0,0.8)'; g.shadowBlur = 14; g.shadowOffsetY = 6;
        g.fillStyle = w.hl ? GOLD : (active ? WHITE : 'rgba(255,255,255,0.72)'); g.fillText(s, x, y); g.restore();
        x += ws[i] + sp;
      });
    });
  });
}

// ---------- render principal ----------
const SCENE_FN = { hook: sHook, problem: sProblem, reveal: sReveal, store: sStore, sales: sSales, views: sViews, research: sResearch, productivity: sProd, cta: sCTA };
function render(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.shadowBlur = 0;
  // sacudida de camara
  let sx = 0, sy = 0; for (const [ts, amp] of TL.shakes) { const d = t - ts; if (d >= 0 && d < 0.8) { const k = amp * Math.exp(-d * 6); sx += (noise1(t * 40) - .5) * 2 * k; sy += (noise1(t * 40 + 99) - .5) * 2 * k; } }
  // zoom de pulso en cada beat (120 bpm) a partir del drop
  const beat = (t >= 14 && t < 89) ? Math.exp(-((t % 0.5)) * 10) * 0.012 : 0;
  g.save(); g.translate(CX + sx, H / 2 + sy); g.scale(1 + beat, 1 + beat); g.translate(-CX, -H / 2);
  background(t);
  const sc = sceneAt(t); SCENE_FN[sc.id](t, t - sc.start);
  hud(t);
  g.restore();
  vignette();
  transition(t);
  // flashes
  let fl = 0; for (const [ts, k] of TL.flashes) { const d = t - ts; if (d >= 0 && d < 0.5) fl = Math.max(fl, k * Math.exp(-d * 9)); }
  if (fl > 0) { g.fillStyle = `rgba(255,250,235,${fl})`; g.fillRect(0, 0, W, H); }
  subtitles(t);
}
window.render = render;
window.ready = document.fonts.load('900 50px ZD').then(() => Promise.all(['800 50px ZD', '700 50px ZD', '600 50px ZI', '700 50px ZI', '500 50px ZI'].map(f => document.fonts.load(f)))).then(() => true);
